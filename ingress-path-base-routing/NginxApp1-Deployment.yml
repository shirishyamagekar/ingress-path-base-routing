apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  labels:
    app: app1-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1-nginx
  template:
    metadata:
      labels:
        app: app1-nginx
    spec:
      containers:
        - name: app1-nginx
          image: shirishyamagekar/app1:1
          ports:
            - containerPort: 80
